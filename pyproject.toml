[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "triplet-based-lineage-reconstruction"
version = "0.1.0"
description = "Code and simulations for triplet-based molecular lineage reconstruction."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Yuting Lin"}
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.6",
    "pandas>=1.3",
    "matplotlib>=3.4",
    "seaborn>=0.11",
    "networkx>=2.6",
    "tqdm>=4.60",
    "cassiopeia-lineage>=2.0",
    "cvxgraphalgs",
]

[tool.setuptools.packages.find]
where = ["src"]
